[package]
name = "nb-books-lector"
version = "1.0.0"
description = "Motor de lectura de NB Books: EPUB, PDF y cómic, saneado y Locator"
authors = ["The NB Books Authors"]
license = "Apache-2.0"
repository = "https://github.com/nb-digital-hq/nb-books"
edition = "2021"
rust-version = "1.98"

# Las versiones son las mismas que declara la aplicación, y por el mismo
# motivo que allí se explica en cada una: este crate no añade ninguna
# dependencia al árbol, solo las lleva a donde se usan.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
ts-rs = "12.0.1"
sha2 = "0.10.9"
flate2 = "1.1.9"
quick-xml = "0.41.0"
# Enlazado en tiempo de ejecución: la ausencia de la biblioteca nativa degrada a
# "componente no instalado" en lugar de romper la compilación. Sin el motor de
# JavaScript de PDFium, que el modelo de amenazas prohíbe.
pdfium-render = { version = "0.9.3", default-features = false, features = [
  "pdfium_7881",
  "thread_safe",
] }
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
